name: weekly-report

on:
  schedule:
    - cron: '0 0 * * 1'      # 每週一 00:00 UTC = 台北時間 08:00
  workflow_dispatch:          # 允許在 Actions 頁手動按鈕觸發（測試用）

permissions:
  contents: write             # 允許把產生的 docs/ commit 回 repo

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 產周報並寄信
        env:
          GMAIL_USER:     ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PW:   ${{ secrets.GMAIL_APP_PW }}
          MAIL_TO:        ${{ secrets.MAIL_TO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_URL:       https://jerry08100.github.io/weekly-trend-report/
        run: python weekly_report.py
      - name: 部署網站（commit docs/ 回 repo）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "周報更新 $(date +%F)"
          git push
