name: weekly-report

on:
  schedule:
    # cron 一律 UTC，註解寫台北時間(UTC+8)。實測 GitHub 排程會延遲 90~180 分鐘。
    # 每天一班就夠（2026-10-12 起不寄信，週報改放部門平台的「趨勢週報」分頁看）：
    #   週日那班 = 新的一週，四個主題全跑；
    #   週一～週六 = 只補本週還沒有內容的主題，四個都齊全就印 [ready] 跳過，零 API。
    # 排在清晨 05:40，延遲後大約 07:10~08:40 跑完 → 週一早上九點開平台時已是本週內容。
    - cron: '40 21 * * *'     # 每天台北 05:40
  workflow_dispatch:          # 允許在 Actions 頁手動按鈕觸發（測試/強制）

permissions:
  contents: write             # 允許把產生的 docs/ commit 回 repo

# 排程與手動觸發湊在一起時排隊跑，不要兩班同時改同一份本週 JSON
concurrency:
  group: weekly-report
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 裝 crawl4ai（正文品質＋跟 Google News 跳轉；失敗不擋周報，程式自動退回 stdlib）
        run: pip install -q crawl4ai && crawl4ai-setup || true
      - name: 產周報
        env:
          TZ:             Asia/Taipei   # runner 預設 UTC，程式判「今天星期幾」要用台北時間
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python weekly_report.py
      - name: 部署網站（commit docs/ 回 repo）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "周報更新 $(date +%F)"
          git pull --rebase --autostash origin main
          git push
