name: weekly-report

on:
  schedule:
    # 週一/二/三 00:00 UTC = 台北 08:00。程式內建「本週已有完整週報就跳過」，
    # 所以週一成功 → 週二/三自動跳過；週一失敗 → 週二(或三)補跑。保證一週一份。
    - cron: '0 0 * * 1,2,3'
  workflow_dispatch:          # 允許在 Actions 頁手動按鈕觸發（測試/強制）

permissions:
  contents: write             # 允許把產生的 docs/ commit 回 repo

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 產周報並寄信
        env:
          GMAIL_USER:     ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PW:   ${{ secrets.GMAIL_APP_PW }}
          MAIL_TO:        ${{ secrets.MAIL_TO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_URL:       https://jerry08100.github.io/weekly-trend-report/
        run: python weekly_report.py
      - name: 部署網站（commit docs/ 回 repo）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "周報更新 $(date +%F)"
          git push
